<div class="batch-page py-4">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Batch Master</h2>
                <p class="text-muted mb-0">Manage training batches</p>
            </div>
            <span class="badge text-bg-primary">12 Batches</span>
        </div>

        <div class="row g-4">
            <!-- Batch list -->
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between">
                        <h5 class="mb-0">Batch List</h5>
                        <input class="form-control form-control-sm w-50" placeholder="Search batches">
                    </div>

                    <div class="card-body">
                        <div class="row">
                            @for (item of batchList(); track $index) {
                            <div class="col-4">
                                <div class="batch-card border rounded p-3 mb-3">
                                    <div class="d-flex justify-content-between">
                                        <h5>{{item.batchName}}</h5> 
                                    </div>

                                    <div class="row text-muted small mt-3">
                                        <div class="col-md-4">
                                            <strong>{{item.teacher}}</strong><br>
                                            
                                        </div>
                                        <div class="col-md-4">
                                            <strong>Start Date</strong><br>
                                            {{item.startDate}}
                                        </div>
                                        <div class="col-md-4">
                                            <strong>End Date</strong><br>
                                          {{item.endDate}}
                                        </div>
                                    </div>

                                    <div class="text-end mt-3">
                                        <button class="btn btn-sm btn-outline-primary me-2" (click)="onEdit(item)">Edit</button>
                                        <button class="btn btn-sm btn-outline-danger" (click)="deleteBatch(item.batchId)">Delete</button>
                                    </div>
                                </div>
                            </div>
                            }

                        </div>



                    </div>
                </div>
            </div>

            <!-- Batch form -->
            <div class="col-12 col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Add New Batch</h5>
                    </div>

                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Batch Name</label>
                            <input class="form-control" [(ngModel)]="newBatch.batchName" placeholder="Enter batch name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teacher</label>
                            <input class="form-control" [(ngModel)]="newBatch.teacher" placeholder="Enter teacher name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="datetime" [(ngModel)]="newBatch.startDate" class="form-control">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">End Date</label>
                            <input type="datetime" [(ngModel)]="newBatch.endDate" class="form-control">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button class="btn btn-outline-secondary">Reset</button>
                            @if (newBatch.batchId ==0 ) {
                                <button class="btn btn-primary" (click)="onSaveBatch()">Save Batch</button>
                            } @else {
                                <button class="btn btn-warning" (click)="onUpdate()">Update Batch</button>
                            } 
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
