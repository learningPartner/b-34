<div class="row">
    <div class="col-8">
        <div class="card">
            <div class="card-header bg-success">
                Vendor List
            </div>
            <div class="card-body ">
                <table class="table table-bordered responsive-table">
                    <thead>
                        <tr>
                            <th>Sr No</th>
                            <th>Vendor Name</th>
                            <th>Email</th>
                            <th>Contact </th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of carList(); track $index) {
                        <tr>
                            <td>{{$index +1}}</td>
                            <td>{{item.vendorName}}</td> 
                            <td>{{item.emailId}}</td>
                               <td>{{item.contactNo}}</td>
                               <td>
                                <button class="btn btn-primary" (click)="editVendor(item)">Edit</button>
                                <button class="btn btn-danger" (click)="onDeleteVendor(item.vendorId)">Delete</button>
                               </td>
                        </tr> 
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-4">
        <div class="card">
            <div class="card-header bg-success">
                Vendor Form
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-12">
                        <label for="">Vendor Name</label>
                        <input type="text" [(ngModel)]="newVendorObj.vendorName" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="">Email</label>
                        <input type="text"  [(ngModel)]="newVendorObj.emailId" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Mobile No</label>
                        <input type="text" [(ngModel)]="newVendorObj.contactNo" class="form-control">
                    </div>
                </div>
                {{newVendorObj.vendorId}}
                <div class="row mt-2">
                    <div class="col-6 text-center">
                        <button class="btn btn-secondary" (click)="onReset()"> Reset </button>
                    </div>
                    <div class="col-6 text-center">
                        @if (newVendorObj.vendorId !== 0) {
                               <button class="btn btn-warning" (click)="onUpdateVendor()" > Update vendor </button>
                        } @else { 
                             <button class="btn btn-success" (click)="onSaveVendor()"> Save vendor </button>
                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
